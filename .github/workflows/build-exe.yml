name: build-exe
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (synthetic client, no game files)
        run: |
          python -m pip install numpy pillow pytest
          python -m pytest -q tests
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: cmd
        run: build_exe.bat
      - name: Smoke test
        shell: pwsh
        run: |
          $out = & dist\Nelderim\Nelderim.exe --deps-ok
          if ($out -notmatch 'DEPS_OK') { throw "exe: numpy/Pillow missing ($out)" }
          $out = & dist\Nelderim\Nelderim.exe --py -c "import numpy, PIL.ImageDraw, PIL.ImageFilter, argparse, hashlib, struct; print('PY_OK')"
          if ($out -notmatch 'PY_OK') { throw "exe --py failed ($out)" }
          $out = & dist\Nelderim\Nelderim.exe --uo3d --help
          if ($LASTEXITCODE -ne 0) { throw "exe --uo3d failed" }
          $out = & dist\Nelderim\Nelderim.exe wire --help
          if ($LASTEXITCODE -ne 0) { throw "exe wire failed" }
          $out = & dist\Nelderim\Nelderim.exe search --help
          if ($LASTEXITCODE -ne 0) { throw "exe search failed" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Nelderim -DestinationPath Nelderim-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nelderim-windows
          path: Nelderim-windows.zip
      - name: Publish release (download link without GitHub login)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ($env:GITHUB_REF_NAME -eq 'main') { 'najnowsza' } else { 'test-' + ($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-') }
          gh release delete $tag --yes --cleanup-tag 2>$null
          $notes = "Pobierz Nelderim-windows.zip, rozpakuj i uruchom Nelderim.exe. Zbudowane z $env:GITHUB_SHA."
          if ($tag -eq 'najnowsza' -or $env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $tag Nelderim-windows.zip --target $env:GITHUB_SHA --title "Nelderim Lab ($tag)" --notes $notes --latest
          } else {
            gh release create $tag Nelderim-windows.zip --target $env:GITHUB_SHA --title "Nelderim Lab – wersja testowa ($env:GITHUB_REF_NAME)" --notes $notes --prerelease
          }
