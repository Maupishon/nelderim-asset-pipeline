name: build-exe
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: cmd
        run: build_exe.bat
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Nelderim -DestinationPath Nelderim-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nelderim-windows
          path: Nelderim-windows.zip
